# Deploys the gallery (index.html + site/ + media folders) to GitHub Pages.
# Settings -> Pages -> Source: GitHub Actions.
name: Deploy gallery to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment3.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (gallery + media it references)
        run: |
          mkdir -p _site
          cp -r index.html .nojekyll site _site/
          mkdir -p _site/motion-graphics
          cp -r motion-graphics/en motion-graphics/zh _site/motion-graphics/
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages sometimes cannot see the just-uploaded artifact ("Found 0 artifact(s)"); retry twice after a pause.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 60
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
